<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scoreboard Show</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,700;1,800;1,900&display=swap" rel="stylesheet">
<style>
  :root { --font: "Barlow Condensed", "Arial Narrow", sans-serif; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: var(--font); }
  body { background: #0a0a0a; }
  body[data-bg="transparent"] { background: transparent; }
  body[data-bg="green"] { background: #00b140; }
  body[data-bg="field"] {
    background:
      repeating-linear-gradient(90deg, transparent 0 158px, rgba(255,255,255,.04) 158px 162px),
      radial-gradient(ellipse at 50% 25%, #5c0a14 0%, #2a0509 45%, #0a0a0a 100%);
  }

  #stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: center; }

  /* ---- optional matchup hero (field background only) ---- */
  .hero { display: none; position: absolute; inset: 120px 0 auto 0; text-align: center; color: #fff; }
  body[data-bg="field"] .hero, body[data-bg="dark"] .hero { display: block; }
  .hero .row { display: flex; align-items: center; justify-content: center; gap: 90px; }
  .hero img { width: 300px; height: 300px; object-fit: contain; filter: drop-shadow(0 12px 30px rgba(0,0,0,.6)); }
  .hero .vs { font: italic 900 110px/1 var(--font); opacity: .9; }
  .hero .names { margin-top: 30px; font: 800 72px/1 var(--font); letter-spacing: 2px; text-shadow: 0 4px 20px rgba(0,0,0,.6); }
  .hero .names span { opacity: .55; margin: 0 26px; }
  .hero .sub { margin-top: 14px; font: 600 34px/1 var(--font); letter-spacing: 6px; opacity: .7; }

  /* ---- score bug ---- */
  .bug {
    position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%);
    display: flex; height: 100px; box-shadow: 0 14px 40px rgba(0,0,0,.55);
    color: #fff;
  }
  .brand {
    position: absolute; left: 0; bottom: 100%; height: 34px; padding: 0 18px;
    display: flex; align-items: center; background: #0b0b0b; color: #fff; border-top: 3px solid #C8102E;
    font: 700 21px/1 var(--font); letter-spacing: 3px;
    clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 100%, 0 100%); padding-right: 34px;
    transition: opacity .3s;
  }
  .info-on .brand { opacity: 0; }

  .team {
    --p: #333; --s: #999;
    position: relative; display: flex; align-items: stretch; width: 430px;
    background: linear-gradient(180deg, rgba(255,255,255,.07) 0%, rgba(255,255,255,0) 40%, rgba(0,0,0,.32) 100%), var(--p);
    border-bottom: 7px solid var(--s); box-sizing: border-box;
    transition: background-color .4s;
  }
  .team + .team { border-left: 2px solid rgba(0,0,0,.35); }
  .logo-wrap {
    width: 112px; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, rgba(0,0,0,.25), rgba(0,0,0,.5)); clip-path: polygon(0 0, 100% 0, 86% 100%, 0 100%);
  }
  .logo { width: 96px; height: 84px; object-fit: contain; filter: drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 1px #fff) drop-shadow(0 3px 4px rgba(0,0,0,.45)); }
  .tinfo { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-left: 10px; min-width: 0; }
  .abbr-row { display: flex; align-items: center; gap: 10px; }
  .abbr { font: italic 800 56px/0.9 var(--font); letter-spacing: 1px; text-shadow: 0 2px 4px rgba(0,0,0,.4); white-space: nowrap; }
  .ball { width: 30px; height: 18px; opacity: 0; transform: scale(.4); transition: all .3s; }
  .poss .ball { opacity: 1; transform: scale(1); }
  .meta { display: flex; align-items: center; gap: 12px; margin-top: 6px; }
  .record { font: 600 19px/1 var(--font); opacity: .85; }
  .tos { display: flex; gap: 5px; }
  .tos i { width: 26px; height: 6px; background: #fff; border-radius: 1px; box-shadow: 0 1px 2px rgba(0,0,0,.4); transition: opacity .3s; }
  .tos i.used { opacity: .2; }
  .score {
    width: 118px; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.28); font: 800 80px/1 var(--font); text-shadow: 0 3px 6px rgba(0,0,0,.45);
    font-variant-numeric: tabular-nums;
  }
  .score.pop { animation: pop .9s ease; }
  @keyframes pop { 0% { transform: scale(1); } 25% { transform: scale(1.35); color: var(--s); } 100% { transform: scale(1); } }
  .poss::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -7px; height: 7px;
    background: linear-gradient(90deg, transparent, #fff, transparent); animation: glow 1.8s ease-in-out infinite;
  }
  @keyframes glow { 50% { opacity: .35; } }

  .game {
    display: flex; align-items: center; gap: 18px; padding: 0 22px 0 26px;
    background: linear-gradient(180deg, #2b2b2b 0%, #0b0b0b 100%); border-bottom: 7px solid #C8102E; box-sizing: border-box;
  }
  .qtr { font: 700 40px/1 var(--font); color: #d5dbe6; min-width: 60px; text-align: center; }
  .clock { font: 800 60px/1 var(--font); font-variant-numeric: tabular-nums; min-width: 128px; text-align: center; }
  .clock.final { min-width: 0; }
  .clock.low { color: #ffd84d; }
  .pc {
    font: 800 30px/1 var(--font); width: 46px; height: 46px; display: flex; align-items: center; justify-content: center;
    background: #000; border: 2px solid #555; border-radius: 4px; font-variant-numeric: tabular-nums;
  }
  .pc.hide { display: none; }
  .pc.warn { color: #ff4b4b; border-color: #ff4b4b; }

  .dd {
    position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center;
    min-width: 210px; padding: 0 24px; background: #f4f4f4; color: #111; border-bottom: 7px solid #C8102E; box-sizing: border-box;
    overflow: hidden; transition: background .25s, min-width .3s, padding .3s;
  }
  .dd .d { font: italic 800 44px/1 var(--font); white-space: nowrap; }
  .dd .spot { font: 700 20px/1 var(--font); margin-top: 4px; color: #4a5468; letter-spacing: 1px; }
  .dd.hide { min-width: 0; padding: 0; width: 0; border: 0; }
  .dd.flag { background: #ffd400; border-bottom-color: #b89900; animation: flagpulse 1s ease-in-out infinite; }
  .dd.flag .d { font-size: 56px; letter-spacing: 3px; }
  .dd.flag .spot { display: none; }
  @keyframes flagpulse { 50% { background: #ffe666; } }

  /* info strip above bug */
  .info {
    position: absolute; left: 0; right: 0; bottom: 100%; height: 46px; display: flex; align-items: center;
    padding: 0 22px; background: rgba(10,10,10,.95); color: #fff; font: 700 26px/1 var(--font); letter-spacing: 1.5px;
    border-top: 4px solid var(--accent, #F2B705);
    clip-path: inset(100% 0 0 0); transition: clip-path .45s ease; white-space: nowrap; overflow: hidden;
  }
  .info-on .info { clip-path: inset(0 0 0 0); }

  /* event banner over the bug */
  .banner {
    --p: #111; --s: #fff;
    position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; gap: 28px;
    background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.35)), var(--p);
    border-bottom: 7px solid var(--s); box-sizing: border-box; overflow: hidden;
    clip-path: inset(0 100% 0 0); visibility: hidden;
  }
  .banner.on { visibility: visible; animation: wipe 6s cubic-bezier(.7,0,.3,1) forwards; }
  @keyframes wipe {
    0% { clip-path: inset(0 100% 0 0); }
    7% { clip-path: inset(0 0 0 0); }
    92% { clip-path: inset(0 0 0 0); }
    100% { clip-path: inset(0 0 0 100%); }
  }
  .banner img { height: 76px; width: 116px; object-fit: contain; filter: drop-shadow(0 3px 5px rgba(0,0,0,.5)); }
  .banner .bt { font: italic 900 60px/.95 var(--font); letter-spacing: 6px; text-shadow: 0 4px 10px rgba(0,0,0,.5); }
  .banner .bs { font: 700 22px/1 var(--font); letter-spacing: 4px; color: #fff; opacity: .9; margin-top: 4px; }
  .banner::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 180px; left: -200px;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent);
  }
  .banner.on::after { animation: shine 1.4s .45s ease-in-out 3; }
  @keyframes shine { to { left: 110%; } }
  .banner.on .bt { animation: zoom .6s .3s both; }
  @keyframes zoom { from { transform: scale(1.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
</style>
</head>
<body data-bg="field">
<div id="stage">
  <div class="hero">
    <div class="row"><img id="hHome" alt=""><div class="vs">VS</div><img id="hAway" alt=""></div>
    <div class="names"><b id="hHomeName"></b><span>vs</span><b id="hAwayName"></b></div>
    <div class="sub" id="hTitle"></div>
  </div>

  <div class="bug" id="bug">
    <div class="brand" id="brand"></div>
    <div class="info" id="info"></div>

    <div class="team" id="home">
      <div class="logo-wrap"><img class="logo" alt=""></div>
      <div class="tinfo">
        <div class="abbr-row"><div class="abbr"></div><svg class="ball" viewBox="0 0 30 18"><ellipse cx="15" cy="9" rx="14" ry="8" fill="#7a3d14" stroke="#fff" stroke-width="1.5"/><path d="M9 9h12M12 7v4M15 7v4M18 7v4" stroke="#fff" stroke-width="1.4"/></svg></div>
        <div class="meta"><div class="tos"><i></i><i></i><i></i></div><div class="record"></div></div>
      </div>
      <div class="score">0</div>
    </div>

    <div class="team" id="away">
      <div class="logo-wrap"><img class="logo" alt=""></div>
      <div class="tinfo">
        <div class="abbr-row"><div class="abbr"></div><svg class="ball" viewBox="0 0 30 18"><ellipse cx="15" cy="9" rx="14" ry="8" fill="#7a3d14" stroke="#fff" stroke-width="1.5"/><path d="M9 9h12M12 7v4M15 7v4M18 7v4" stroke="#fff" stroke-width="1.4"/></svg></div>
        <div class="meta"><div class="tos"><i></i><i></i><i></i></div><div class="record"></div></div>
      </div>
      <div class="score">0</div>
    </div>

    <div class="game">
      <div class="qtr" id="qtr">1ST</div>
      <div class="clock" id="clock">12:00</div>
      <div class="pc hide" id="pc">40</div>
    </div>

    <div class="dd" id="dd"><div class="d" id="ddText">1ST &amp; 10</div><div class="spot" id="spot"></div></div>

    <div class="banner" id="banner"><img alt=""><div><div class="bt"></div><div class="bs"></div></div></div>
  </div>
</div>

<script src="../js/config.js?v=9"></script>
<script src="../js/sync.js?v=9"></script>
<script>
(function () {
  const $ = (s, r = document) => r.querySelector(s);
  const params = new URLSearchParams(location.search);
  document.body.dataset.bg = params.get("bg") || "field";

  const stage = $("#stage");
  function fit() {
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = `translate(-50%, -50%) scale(${s})`;
  }
  addEventListener("resize", fit); fit();

  const QTR = { "1": "1ST", "2": "2ND", "3": "3RD", "4": "4TH", "OT": "OT", "HALF": "HALF", "FINAL": "FINAL" };
  const DOWN = { 1: "1ST", 2: "2ND", 3: "3RD", 4: "4TH" };

  function fmtClock(ms) {
    if (ms < 60000) {
      const t = Math.floor(ms / 100);
      return Math.floor(t / 10) + "." + (t % 10);
    }
    const s = Math.ceil(ms / 1000);
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }
  const setImg = (img, src) => { const u = SB.asset(src); if (img.dataset.src !== u) { img.dataset.src = u; img.src = u; } };
  const setText = (el, t) => { if (el.textContent !== t) el.textContent = t; };

  const prevScore = {};
  function renderTeam(side, t, st) {
    const el = $("#" + side);
    el.style.setProperty("--p", t.primary);
    el.style.setProperty("--s", t.secondary);
    setImg($(".logo", el), t.logo);
    setText($(".abbr", el), (t.abbr || "").toUpperCase());
    setText($(".record", el), t.record || "");
    const sc = $(".score", el);
    setText(sc, String(t.score));
    if (prevScore[side] !== undefined && t.score > prevScore[side]) {
      sc.classList.remove("pop"); void sc.offsetWidth; sc.classList.add("pop");
    }
    prevScore[side] = t.score;
    [...el.querySelectorAll(".tos i")].forEach((i, n) => i.classList.toggle("used", n >= t.timeouts));
    el.classList.toggle("poss", st.possession === side && !["HALF", "FINAL"].includes(st.quarter));
  }

  let lastBanner = null;
  function playBanner(st) {
    const b = st.banner || {};
    if (!SB.loaded) return;
    if (lastBanner === null) { lastBanner = b.ts; return; } // don't replay on page load
    if (!b.ts || b.ts === lastBanner) return;
    lastBanner = b.ts;
    if (SB.now() - b.ts > 10000 || !b.text) return;
    const el = $("#banner");
    const t = st[b.team];
    el.style.setProperty("--p", t ? t.primary : "#111");
    el.style.setProperty("--s", t ? t.secondary : "#F2B705");
    const img = $("img", el);
    img.style.display = t ? "" : "none";
    if (t) setImg(img, t.logo);
    $(".bt", el).textContent = b.text.toUpperCase();
    $(".bs", el).textContent = t ? SB.fullName(t) : "";
    el.classList.remove("on"); void el.offsetWidth; el.classList.add("on");
  }

  function render(st) {
    renderTeam("away", st.away, st);
    renderTeam("home", st.home, st);
    setText($("#brand"), st.title || "");
    setText($("#qtr"), QTR[st.quarter] || String(st.quarter));

    const dd = $("#dd");
    const over = ["HALF", "FINAL"].includes(st.quarter);
    dd.classList.toggle("flag", !!st.flag);
    dd.classList.toggle("hide", !st.flag && (!st.showDown || over));
    if (st.flag) setText($("#ddText"), "FLAG");
    else {
      const dist = String(st.distance || "").toUpperCase();
      setText($("#ddText"), `${DOWN[st.down] || st.down} & ${dist}`);
    }
    const bo = st.ballOn || {};
    let spot = "";
    if (bo.yard !== "" && bo.yard != null) {
      spot = String(bo.yard) === "50" ? "BALL ON 50" : `BALL ON ${(st[bo.side] ? st[bo.side].abbr : "").toUpperCase()} ${bo.yard}`;
    }
    setText($("#spot"), spot);

    const bug = $("#bug");
    bug.classList.toggle("info-on", !!(st.info && st.info.show && st.info.text));
    setText($("#info"), (st.info && st.info.text) || "");
    $("#info").style.setProperty("--accent", st.home.primary);

    setImg($("#hAway"), st.away.logo); setImg($("#hHome"), st.home.logo);
    setText($("#hAwayName"), (st.away.mascot || st.away.name).toUpperCase());
    setText($("#hHomeName"), (st.home.mascot || st.home.name).toUpperCase());
    setText($("#hTitle"), st.title || "");

    playBanner(st);
  }

  function tick() {
    const st = SB.get();
    const clock = $("#clock");
    const over = ["HALF", "FINAL"].includes(st.quarter);
    clock.style.display = over ? "none" : "";
    if (!over) {
      const ms = SB.timerMs(st.clock);
      setText(clock, fmtClock(ms));
      clock.classList.toggle("low", ms < 60000 && ms > 0);
    }
    const pc = $("#pc");
    const p = st.play || {};
    pc.classList.toggle("hide", !p.show || over);
    if (p.show) {
      const ms = SB.timerMs(p);
      setText(pc, String(Math.ceil(ms / 1000)));
      pc.classList.toggle("warn", ms <= 5000);
    }
    requestAnimationFrame(tick);
  }

  SB.onChange(render);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
