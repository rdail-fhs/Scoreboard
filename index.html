<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fulton Scoreboard</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(ellipse at top, #6b0a16, #0a0a0a 70%); color: #fff; font-family: "Barlow Condensed", sans-serif; }
  .box { text-align: center; padding: 24px; }
  h1 { font-size: 56px; margin: 0 0 6px; letter-spacing: 2px; }
  p { font-size: 22px; opacity: .7; margin: 0 0 28px; letter-spacing: 3px; }
  a { display: inline-block; margin: 8px; padding: 18px 40px; font-size: 28px; color: #fff; background: #C8102E; border-radius: 12px; text-decoration: none; }
  a.alt { background: transparent; color: #fff; border: 2px solid #fff; }
</style>
</head>
<body>
  <div class="box">
    <h1>STEAMERS vs MUSTANGS</h1>
    <p>FULTON HIGH SCHOOL FOOTBALL</p>
    <a href="show/">Scoreboard</a><a class="alt" href="control/">Control</a>
  </div>
</body>
</html>
