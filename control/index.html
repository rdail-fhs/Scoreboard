<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Scoreboard Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0c0c; --card: #181818; --card2: #222; --line: #333; --text: #f1f1f1; --muted: #9a9a9a;
    --accent: #C8102E; --go: #1db954; --stop: #e5484d; --flag: #ffd400;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 Inter, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  header {
    position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 16px; background: rgba(12,12,12,.95); border-bottom: 3px solid var(--accent); backdrop-filter: blur(8px);
  }
  header h1 { margin: 0; font: 800 22px/1 "Barlow Condensed", sans-serif; letter-spacing: 1px; }
  .status { font-size: 12px; padding: 4px 10px; border-radius: 99px; background: var(--card2); color: var(--muted); }
  .status.live { background: rgba(29,185,84,.15); color: #4ade80; }
  .status.local { background: rgba(255,200,0,.15); color: #ffc800; }
  .status.offline, .status.error { background: rgba(229,72,77,.15); color: #ff8a8d; }
  header a { margin-left: auto; color: #ff4d5e; text-decoration: none; font-weight: 600; }

  main { max-width: 1200px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; grid-template-columns: 1fr 1fr; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .full { grid-column: 1 / -1; }
  h2 { margin: 0 0 10px; font: 700 13px/1 Inter, sans-serif; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .row + .row { margin-top: 8px; }

  button {
    font: 700 16px/1 Inter, sans-serif; color: var(--text); background: var(--card2); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 14px; min-height: 46px; cursor: pointer; touch-action: manipulation;
  }
  button:hover { border-color: #46516a; }
  button:active { transform: scale(.97); }
  button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.big { font-size: 20px; padding: 16px 20px; min-height: 60px; }
  button.go { background: var(--go); border-color: var(--go); color: #fff; }
  button.stop { background: var(--stop); border-color: var(--stop); color: #fff; }
  button.flag { background: var(--flag); color: #111; border-color: var(--flag); }
  button.ghost { background: transparent; }
  input, select {
    font: 600 16px Inter, sans-serif; color: var(--text); background: #0e121a; border: 1px solid var(--line);
    border-radius: 8px; padding: 10px; min-height: 44px; width: 100%;
  }
  input[type=color] { padding: 2px; width: 56px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }

  .teams { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 640px) { .teams { grid-template-columns: 1fr; } }
  .tcard { border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: var(--card); }
  .thead { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--p); border-bottom: 5px solid var(--s); }
  .thead img { width: 54px; height: 54px; object-fit: contain; }
  .thead .nm { font: 800 26px/1 "Barlow Condensed", sans-serif; flex: 1; text-shadow: 0 2px 3px rgba(0,0,0,.4); }
  .thead .sc { font: 800 56px/1 "Barlow Condensed", sans-serif; min-width: 70px; text-align: right; text-shadow: 0 2px 3px rgba(0,0,0,.4); }
  .tbody { padding: 12px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .pips { display: flex; gap: 6px; flex: 1; }
  .pips i { flex: 1; height: 10px; border-radius: 3px; background: var(--accent); }
  .pips i.used { background: var(--line); }

  .clockface { font: 800 72px/1 "Barlow Condensed", sans-serif; font-variant-numeric: tabular-nums; text-align: center; padding: 6px 0 12px; }
  .clockface small { font-size: 28px; color: var(--muted); margin-left: 14px; }
  .clockface.run { color: #4ade80; }
  .inline { display: flex; gap: 6px; align-items: center; }
  .inline input { width: 80px; text-align: center; }
  details summary { cursor: pointer; font-weight: 700; color: var(--muted); padding: 4px 0; }
  .setup { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .setup .wide { grid-column: 1 / -1; }
  .hint { color: var(--muted); font-size: 13px; }
  kbd { background: var(--card2); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>FULTON SCOREBOARD · CONTROL</h1>
  <span class="status" id="status">connecting…</span>
  <span class="hint" id="gameid"></span>
  <a id="showLink" href="../show/" target="_blank">Open Show ↗</a>
</header>

<main>
  <!-- Teams / scoring -->
  <section class="full teams" id="teams"></section>

  <!-- Clock -->
  <section class="card">
    <h2>Game Clock <span class="hint">· <kbd>Space</kbd> start/stop</span></h2>
    <div class="clockface" id="clockface">12:00<small id="qlabel">1ST</small></div>
    <div class="row">
      <button class="big go" id="clockBtn" data-act="clockToggle" style="flex:1">START</button>
    </div>
    <div class="row">
      <button data-act="clockAdj" data-n="-1">−1s</button>
      <button data-act="clockAdj" data-n="1">+1s</button>
      <button data-act="clockAdj" data-n="-10">−10s</button>
      <button data-act="clockAdj" data-n="10">+10s</button>
      <button data-act="clockReset">Reset Qtr</button>
    </div>
    <div class="row">
      <div class="inline"><input id="setMin" type="number" min="0" max="59" placeholder="min"><b>:</b><input id="setSec" type="number" min="0" max="59" placeholder="sec"></div>
      <button data-act="clockSet">Set Clock</button>
    </div>
    <div class="row" id="qtrs"></div>
  </section>

  <!-- Down & distance -->
  <section class="card">
    <h2>Down &amp; Distance <span class="hint">· <kbd>F</kbd> flag</span></h2>
    <div class="row" id="downs"></div>
    <div class="row">
      <button data-act="dist" data-v="10">&amp; 10</button>
      <button data-act="dist" data-v="Goal">&amp; Goal</button>
      <button data-act="dist" data-v="Inches">&amp; Inches</button>
      <div class="inline" style="flex:1"><input id="distIn" placeholder="Distance (e.g. 7)"></div>
    </div>
    <div class="row">
      <span class="hint">Ball on</span>
      <button data-act="ballSide" data-side="home" id="bsHome">HOME</button>
      <button data-act="ballSide" data-side="away" id="bsAway">AWAY</button>
      <div class="inline"><input id="yardIn" type="number" min="1" max="50" placeholder="yd"></div>
      <button data-act="firstDown">1st &amp; 10</button>
    </div>
    <div class="row">
      <button class="big flag" data-act="flag" id="flagBtn" style="flex:1">🚩 FLAG</button>
      <button class="big" data-act="ddToggle" id="ddBtn">Hide D&amp;D</button>
    </div>
    <h2 style="margin-top:16px">Play Clock</h2>
    <div class="row">
      <button data-act="play" data-n="40">40</button>
      <button data-act="play" data-n="25">25</button>
      <button data-act="playToggle" id="playBtn">Stop</button>
      <button data-act="playHide">Hide</button>
      <span class="clockface" id="playface" style="font-size:40px;padding:0 0 0 10px">–</span>
    </div>
  </section>

  <!-- Banners -->
  <section class="card full">
    <h2>Graphics</h2>
    <div class="row" id="banners"></div>
    <div class="row">
      <div style="flex:2;min-width:200px"><input id="customBanner" placeholder="Custom banner text (e.g. FIRST DOWN)"></div>
      <select id="customTeam" style="flex:1;min-width:130px"><option value="home">Home colors</option><option value="away">Away colors</option><option value="">Neutral</option></select>
      <button data-act="customBanner">Show Banner</button>
    </div>
    <div class="row">
      <div style="flex:2;min-width:200px"><input id="infoIn" placeholder="Info strip above scoreboard (e.g. Halftime: Steamers Marching Band)"></div>
      <button data-act="infoShow" id="infoBtn">Show Strip</button>
    </div>
  </section>

  <!-- Setup -->
  <section class="card full">
    <details>
      <summary>Team &amp; game setup</summary>
      <div class="teams" id="setup" style="margin-top:12px"></div>
      <div class="setup">
        <div><label>Scoreboard title</label><input data-field="title"></div>
        <div><label>Quarter length (minutes)</label><input id="qlen" type="number" min="1" max="15"></div>
        <div class="wide row">
          <button data-act="swapPoss">Swap possession</button>
          <button data-act="resetTOs">Reset timeouts (new half)</button>
          <button class="stop" data-act="resetGame">Reset entire game</button>
        </div>
        <p class="hint wide">Show page options: add <code>?bg=transparent</code> for OBS / streaming, <code>?bg=green</code> for chroma key, <code>?bg=dark</code> for a plain background.</p>
      </div>
    </details>
  </section>
</main>

<template id="teamTpl">
  <div class="tcard">
    <div class="thead"><img alt=""><div class="nm"></div><div class="sc">0</div></div>
    <div class="tbody">
      <div class="grid3">
        <button class="big" data-act="score" data-n="6" data-banner="TOUCHDOWN">TD +6</button>
        <button class="big" data-act="score" data-n="3" data-banner="FIELD GOAL">FG +3</button>
        <button class="big" data-act="score" data-n="2" data-banner="SAFETY">Safety +2</button>
        <button data-act="score" data-n="1" data-banner="PAT GOOD">PAT +1</button>
        <button data-act="score" data-n="2" data-banner="2-PT GOOD">2-PT +2</button>
        <button class="ghost" data-act="score" data-n="-1">−1</button>
      </div>
      <div class="row" style="margin-top:10px">
        <span class="hint">TOs</span>
        <div class="pips"><i></i><i></i><i></i></div>
        <button data-act="to" data-n="-1">Use TO</button>
        <button class="ghost" data-act="to" data-n="1">+</button>
      </div>
      <div class="row">
        <button class="poss-btn" data-act="poss" style="flex:1">🏈 Possession</button>
      </div>
    </div>
  </div>
</template>

<template id="setupTpl">
  <div class="card" style="background:var(--card2)">
    <h2 class="sh"></h2>
    <div class="setup">
      <div><label>School / name</label><input data-f="name"></div>
      <div><label>Mascot</label><input data-f="mascot"></div>
      <div><label>Abbreviation (3–4)</label><input data-f="abbr" maxlength="5"></div>
      <div><label>Record</label><input data-f="record" placeholder="5-1"></div>
      <div><label>Primary color</label><div class="inline"><input type="color" data-f="primary"><input data-f="primary"></div></div>
      <div><label>Secondary color</label><div class="inline"><input type="color" data-f="secondary"><input data-f="secondary"></div></div>
      <div class="wide"><label>Logo URL (or upload)</label><input data-f="logo"></div>
      <div class="wide"><label>Touchdown animation video (blank = standard banner)</label><input data-f="tdVideo" placeholder="assets/anim/team-td.webm"></div>
      <div class="wide"><input type="file" accept="image/*" class="upload"></div>
    </div>
  </div>
</template>

<script src="../js/config.js?v=12"></script>
<script src="../js/sync.js?v=12"></script>
<script>
(function () {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const u = (p) => SB.update(p);
  const st = () => SB.get();

  const SIDES = ["home", "away"];
  const QTR = { "1": "1ST", "2": "2ND", "3": "3RD", "4": "4TH", "OT": "OT", "HALF": "HALF", "FINAL": "FINAL" };

  // keep ?game= on the show link
  const qs = location.search;
  $("#showLink").href = "../show/" + qs;
  $("#gameid").textContent = "game: " + SB.game;

  SB.onStatus((s) => {
    const el = $("#status");
    el.className = "status " + s;
    el.textContent = { live: { firebase: "● LIVE (Firebase)", google: "● LIVE (Google)", server: "● LIVE (Mac server)" }[SB.mode] || "● LIVE", local: "● Local mode (same browser only)", offline: "● Offline – reconnecting", error: "● Connection error", connecting: "connecting…" }[s] || s;
  });

  // ----- build team cards -----
  SIDES.forEach((side) => {
    const c = $("#teamTpl").content.cloneNode(true).firstElementChild;
    c.dataset.side = side;
    $$("[data-act]", c).forEach((b) => (b.dataset.side = side));
    $("#teams").appendChild(c);

    const s = $("#setupTpl").content.cloneNode(true).firstElementChild;
    s.dataset.side = side;
    $(".sh", s).textContent = side === "home" ? "Home team" : "Away team";
    $("#setup").appendChild(s);
    $$("[data-f]", s).forEach((inp) => {
      inp.addEventListener("change", () => {
        let v = inp.value.trim();
        if (inp.dataset.f === "abbr") v = v.toUpperCase();
        u({ [`${side}/${inp.dataset.f}`]: v });
      });
    });
    $(".upload", s).addEventListener("change", (e) => {
      const f = e.target.files[0];
      if (f) shrinkImage(f).then((data) => u({ [`${side}/logo`]: data }));
    });
  });

  // Downscale uploaded logos so they sync quickly
  function shrinkImage(file) {
    return new Promise((res) => {
      const img = new Image();
      img.onload = () => {
        const max = 256, r = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement("canvas");
        cv.width = Math.round(img.width * r); cv.height = Math.round(img.height * r);
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        res(cv.toDataURL("image/png"));
        URL.revokeObjectURL(img.src);
      };
      img.src = URL.createObjectURL(file);
    });
  }

  Object.keys(QTR).forEach((q) => {
    const b = document.createElement("button");
    b.dataset.act = "qtr"; b.dataset.v = q; b.textContent = QTR[q];
    $("#qtrs").appendChild(b);
  });
  [1, 2, 3, 4].forEach((d) => {
    const b = document.createElement("button");
    b.className = "big"; b.dataset.act = "down"; b.dataset.n = d; b.textContent = ["1st", "2nd", "3rd", "4th"][d - 1];
    b.style.flex = "1";
    $("#downs").appendChild(b);
  });
  [
    ["TOUCHDOWN", 1], ["FIELD GOAL", 1], ["INTERCEPTION", 1], ["FUMBLE", 1], ["FIRST DOWN", 1], ["SACK", 1],
    ["TURNOVER ON DOWNS", 1], ["TIMEOUT", 1], ["HALFTIME", 0], ["FINAL", 0]
  ].forEach(([t, perTeam]) => {
    const sides = perTeam ? SIDES : [""];
    sides.forEach((side) => {
      const b = document.createElement("button");
      b.dataset.act = "banner"; b.dataset.text = t; b.dataset.team = side;
      b.textContent = t + (side ? " · " + side.toUpperCase() : "");
      b.className = "bn-" + (side || "neutral");
      $("#banners").appendChild(b);
    });
  });

  // ----- actions -----
  const timerStop = (key) => ({ [`${key}/running`]: false, [`${key}/remaining`]: SB.timerMs(st()[key]) });
  const timerSet = (key, ms, running) => ({
    [`${key}/remaining`]: Math.max(0, ms), [`${key}/startedAt`]: SB.now(), [`${key}/running`]: running
  });
  const banner = (text, team) => u({ "banner/text": text, "banner/team": team || "", "banner/ts": SB.now() });

  const actions = {
    score(b) {
      const side = b.dataset.side, n = +b.dataset.n;
      u({ [`${side}/score`]: Math.max(0, st()[side].score + n) });
      if (b.dataset.banner && n > 0) banner(b.dataset.banner, side);
    },
    to(b) {
      const side = b.dataset.side, t = st()[side].timeouts + +b.dataset.n;
      if (t < 0 || t > 3) return;
      const p = { [`${side}/timeouts`]: t };
      if (+b.dataset.n < 0) Object.assign(p, timerStop("clock"));
      u(p);
      if (+b.dataset.n < 0) banner("TIMEOUT", side);
    },
    poss(b) { u({ possession: b.dataset.side }); },
    swapPoss() { u({ possession: st().possession === "home" ? "away" : "home" }); },
    clockToggle() {
      const c = st().clock;
      if (c.running) u(timerStop("clock"));
      else if (SB.timerMs(c) > 0) u(timerSet("clock", c.remaining, true));
    },
    clockAdj(b) { const c = st().clock; u(timerSet("clock", SB.timerMs(c) + b.dataset.n * 1000, c.running)); },
    clockReset() { u(timerSet("clock", st().clock.length, false)); },
    clockSet() {
      const m = +$("#setMin").value || 0, s = +$("#setSec").value || 0;
      u(timerSet("clock", (m * 60 + s) * 1000, st().clock.running));
      $("#setMin").value = $("#setSec").value = "";
    },
    qtr(b) {
      const v = b.dataset.v, prev = st().quarter;
      const p = { quarter: v };
      if (v !== prev && ["1", "2", "3", "4", "OT"].includes(v)) Object.assign(p, timerSet("clock", st().clock.length, false));
      if (v === "3" && ["1", "2", "HALF"].includes(prev)) Object.assign(p, { "home/timeouts": 3, "away/timeouts": 3 });
      if (v === "HALF" || v === "FINAL") Object.assign(p, timerStop("clock"), { "play/show": false });
      u(p);
    },
    down(b) { u({ down: +b.dataset.n, flag: false }); },
    dist(b) { u({ distance: b.dataset.v }); },
    firstDown() { u({ down: 1, distance: "10", flag: false }); },
    ballSide(b) { u({ "ballOn/side": b.dataset.side }); },
    flag() { u({ flag: !st().flag }); },
    ddToggle() { u({ showDown: !st().showDown }); },
    play(b) { u(Object.assign(timerSet("play", b.dataset.n * 1000, true), { "play/show": true })); },
    playToggle() {
      const p = st().play;
      if (p.running) u(timerStop("play"));
      else if (SB.timerMs(p) > 0) u(Object.assign(timerSet("play", p.remaining, true), { "play/show": true }));
    },
    playHide() { u(Object.assign(timerStop("play"), { "play/show": false })); },
    banner(b) { banner(b.dataset.text, b.dataset.team); },
    customBanner() { const t = $("#customBanner").value.trim(); if (t) banner(t, $("#customTeam").value); },
    infoShow() {
      const show = !st().info.show;
      u({ "info/text": $("#infoIn").value.trim(), "info/show": show && !!$("#infoIn").value.trim() });
    },
    resetTOs() { u({ "home/timeouts": 3, "away/timeouts": 3 }); },
    resetGame() {
      if (!confirm("Reset scores, clock, quarter and timeouts?")) return;
      const s = st(), len = s.clock.length;
      u({
        "home/score": 0, "away/score": 0, "home/timeouts": 3, "away/timeouts": 3, quarter: "1",
        clock: { running: false, remaining: len, startedAt: 0, length: len },
        play: { running: false, remaining: 40000, startedAt: 0, show: false },
        down: 1, distance: "10", "ballOn/yard": "", flag: false, "info/show": false
      });
    }
  };
  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]");
    if (b && actions[b.dataset.act]) actions[b.dataset.act](b);
  });

  $("#distIn").addEventListener("change", (e) => { const v = e.target.value.trim(); if (v) u({ distance: v }); e.target.value = ""; });
  $("#yardIn").addEventListener("change", (e) => u({ "ballOn/yard": e.target.value.trim() }));
  $("#infoIn").addEventListener("change", (e) => u({ "info/text": e.target.value.trim() }));
  $("[data-field=title]").addEventListener("change", (e) => u({ title: e.target.value.trim() }));
  $("#qlen").addEventListener("change", (e) => {
    const ms = Math.max(1, +e.target.value || 12) * 60000;
    const p = { "clock/length": ms };
    if (!st().clock.running) p["clock/remaining"] = ms;
    u(p);
  });

  document.addEventListener("keydown", (e) => {
    if (/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
    if (e.code === "Space") { e.preventDefault(); actions.clockToggle(); }
    if (e.key === "f" || e.key === "F") actions.flag();
  });

  // ----- render -----
  const val = (el, v) => { if (document.activeElement !== el && el.value !== String(v ?? "")) el.value = v ?? ""; };
  function fmt(ms) {
    if (ms < 60000) { const t = Math.floor(ms / 100); return Math.floor(t / 10) + "." + (t % 10); }
    const s = Math.ceil(ms / 1000); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }

  function render(s) {
    SIDES.forEach((side) => {
      const t = s[side];
      const c = $(`.tcard[data-side=${side}]`);
      c.style.setProperty("--p", t.primary); c.style.setProperty("--s", t.secondary);
      const img = $(".thead img", c), src = SB.asset(t.logo);
      if (img.dataset.src !== src) { img.dataset.src = src; img.src = src; }
      $(".nm", c).textContent = SB.fullName(t);
      $(".sc", c).textContent = t.score;
      $$(".pips i", c).forEach((i, n) => i.classList.toggle("used", n >= t.timeouts));
      $(".poss-btn", c).classList.toggle("on", s.possession === side);

      const su = $(`#setup [data-side=${side}]`);
      $$("[data-f]", su).forEach((inp) => {
        const v = t[inp.dataset.f];
        if (inp.dataset.f === "logo" && String(v).startsWith("data:")) val(inp, "(uploaded image)");
        else val(inp, v);
      });
      $$(`.bn-${side}`).forEach((b) => { b.style.background = t.primary; b.style.borderColor = t.secondary; b.style.color = "#fff"; });
      $(side === "home" ? "#bsHome" : "#bsAway").textContent = t.abbr;
    });
    $("#bsHome").classList.toggle("on", s.ballOn.side === "home");
    $("#bsAway").classList.toggle("on", s.ballOn.side === "away");
    val($("#yardIn"), s.ballOn.yard);
    $$("#downs button").forEach((b) => b.classList.toggle("on", +b.dataset.n === +s.down));
    $$("[data-act=dist]").forEach((b) => b.classList.toggle("on", b.dataset.v === String(s.distance)));
    $("#distIn").placeholder = "Distance: " + s.distance;
    $$("#qtrs button").forEach((b) => b.classList.toggle("on", b.dataset.v === String(s.quarter)));
    $("#qlabel").textContent = QTR[s.quarter] || s.quarter;
    $("#flagBtn").textContent = s.flag ? "✕ CLEAR FLAG" : "🚩 FLAG";
    $("#ddBtn").textContent = s.showDown ? "Hide D&D" : "Show D&D";
    $("#infoBtn").textContent = s.info.show ? "Hide Strip" : "Show Strip";
    $("#infoBtn").classList.toggle("on", s.info.show);
    val($("#infoIn"), s.info.text);
    val($("[data-field=title]"), s.title);
    val($("#qlen"), Math.round(s.clock.length / 60000));
  }

  function tick() {
    const s = st();
    const ms = SB.timerMs(s.clock);
    const face = $("#clockface");
    face.firstChild.nodeValue = fmt(ms);
    face.classList.toggle("run", s.clock.running);
    const btn = $("#clockBtn");
    btn.textContent = s.clock.running ? "STOP" : "START";
    btn.className = "big " + (s.clock.running ? "stop" : "go");

    // auto-stop timers at zero (only the controller writes)
    if (s.clock.running && ms <= 0) u({ "clock/running": false, "clock/remaining": 0 });
    const pms = SB.timerMs(s.play);
    if (s.play.running && pms <= 0) u({ "play/running": false, "play/remaining": 0 });
    $("#playface").textContent = s.play.show ? Math.ceil(pms / 1000) : "–";
    $("#playBtn").textContent = s.play.running ? "Stop" : "Resume";
    requestAnimationFrame(tick);
  }

  SB.onChange(render);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
